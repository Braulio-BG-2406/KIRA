# transferencia = 2500
# vistoria_cautelar = 800
# preparacao_pct = 0.03
# preparacao_min = 3000
# fator_revenda = 0.95
# km_ano = 70000
# ajuste_km_10mil = 0.003
# margem_min_pct = 0.10
# lucro_min = 15000

